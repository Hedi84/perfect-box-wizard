services:
  - type: web
    name: perfect-box-wizard
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: ./bin/rails server
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: perfect-box-wizard-db
          property: connectionString

      - key: RAILS_MASTER_KEY
        sync: false

      - key: WEB_CONCURRENCY
        value: 2

databases:
  - name: perfect-box-wizard-db
    plan: free